<style>

    --suie:#16130f;
    --sodium:#ff9e1b;
    --craie:#ece5d3;

    color:var(--craie);

<script>
"use strict";
const W=960, H=540;
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");

/* ------------------------------------------------------------------ */
/* Audio : petits bruitages synthétiques, créés au premier input       */
/* ------------------------------------------------------------------ */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); }
function beep(freq,dur,type,vol,slide){
  if(!AC)return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function whoosh(){
  if(!AC)return;
  const n=AC.sampleRate*0.25, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime;
  s.buffer=buf; f.type="bandpass"; f.frequency.setValueAtTime(500,t);
  f.frequency.exponentialRampToValueAtTime(2400,t+0.22);
  g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
const sfx={
  uraken(){ whoosh(); },
  hit(){ beep(120,0.09,"square",0.18,-60); },
  kill(){ beep(300,0.2,"sawtooth",0.12,-240); },
  hurt(){ beep(90,0.18,"sawtooth",0.16,-40); },
  pickup(){ beep(520,0.08,"square",0.10); setTimeout(()=>beep(780,0.10,"square",0.10),80); },
  levelup(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.12,"square",0.10),i*90)); },
  go(){ beep(660,0.08,"square",0.08); },
  lance(){ beep(880,0.10,"triangle",0.09,-420); },
  eau(){ beep(150,0.22,"sine",0.16,-70); },
  casse(){ beep(220,0.16,"square",0.13,-140); },
};

/* ------------------------------------------------------------------ */
/* Musique — fanfare de marche originale, synthétisée à la volée.      */
/* L'hymne « Pays de Charleroi » (1867) est libre de droits, mais tout */
/* enregistrement récent ne l'est pas : d'où ce morceau original, et   */
/* le bouton qui permet de charger sa propre piste depuis son disque.  */
/* ------------------------------------------------------------------ */
const hz=m=>440*Math.pow(2,(m-69)/12);
const R=null;
/* 8 mesures à 4 temps — [note MIDI, durée en temps] */
const MELODIE=[
  [69,1],[69,.5],[69,.5],[74,2],
  [77,1],[76,1],[74,1],[72,1],
  [74,1],[69,.5],[69,.5],[65,2],
  [67,1],[69,1],[70,2],
  [69,1],[69,.5],[69,.5],[74,2],
  [77,1],[79,1],[81,2],
  [79,1],[77,1],[76,1],[74,1],
  [74,2],[R,2],
];
/* accords par mesure : fondamentale, quinte, et les notes de l'accord */
const GRILLE=[
  {b:50,acc:[62,65,69]},  // Dm
  {b:50,acc:[62,65,69]},  // Dm
  {b:46,acc:[58,62,65]},  // Bb
  {b:43,acc:[55,58,62]},  // Gm
  {b:50,acc:[62,65,69]},  // Dm
  {b:46,acc:[58,62,65]},  // Bb
  {b:45,acc:[57,61,64]},  // A7
  {b:50,acc:[62,65,69]},  // Dm
];
const MUS={on:true,gain:null,timer:null,next:0,step:0,src:null,buf:null,mode:"fanfare"};
const TEMPO=104, BEAT=60/TEMPO;

function musNote(t,freq,dur,type,vol,cutoff){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.setValueAtTime(vol,t+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  let node=o;
  if(cutoff){
    const f=AC.createBiquadFilter();
    f.type="lowpass";f.frequency.setValueAtTime(cutoff,t);
    o.connect(f);node=f;
  }
  node.connect(g).connect(MUS.gain);
  o.start(t);o.stop(t+dur+0.05);
}
function musDrum(t,kind){
  if(kind==="kick"){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine";o.frequency.setValueAtTime(110,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    g.gain.setValueAtTime(0.5,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+0.18);
  }else{
    const n=Math.floor(AC.sampleRate*0.13), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    s.buffer=buf;f.type="highpass";f.frequency.setValueAtTime(1400,t);
    g.gain.setValueAtTime(0.30,t);
    s.connect(f).connect(g).connect(MUS.gain);s.start(t);
  }
}
/* index de départ de chaque note de la mélodie, en temps */
const MEL_POS=(()=>{let p=0;return MELODIE.map(n=>{const s=p;p+=n[1];return s;});})();
const BOUCLE=32; // 8 mesures × 4 temps

function musScheduler(){
  if(!AC||!MUS.gain)return;
  while(MUS.next<AC.currentTime+0.25){
    const beat=MUS.step%BOUCLE;
    const mes=Math.floor(beat/4), t=MUS.next;
    const ch=GRILLE[mes];
    /* oom-pah : basse de tuba sur 1 et 3, contretemps de cuivres sur 2 et 4 */
    if(beat%2===0){
      musNote(t,hz(beat%4===0?ch.b:ch.b+7),BEAT*0.75,"triangle",0.30,420);
      musDrum(t,"kick");
    }else{
      ch.acc.forEach(n=>musNote(t,hz(n),BEAT*0.42,"sawtooth",0.055,1500));
      musDrum(t,"snare");
    }
    /* la mélodie de fanfare, deux voix à l'octave */
    MELODIE.forEach((n,i)=>{
      if(n[0]===R||MEL_POS[i]!==beat)return;
      const d=n[1]*BEAT*0.92;
      musNote(t,hz(n[0]),d,"square",0.085,2600);
      musNote(t,hz(n[0]-12),d,"triangle",0.055,1200);
    });
    MUS.next+=BEAT;MUS.step++;
  }
}
function musEnsure(){
  if(!AC||!MUS.on)return;
  if(!MUS.gain){
    MUS.gain=AC.createGain();
    MUS.gain.gain.value=0.5;
    MUS.gain.connect(AC.destination);
  }
  if(MUS.mode==="fichier"){
    if(!MUS.src&&MUS.buf){
      MUS.src=AC.createBufferSource();
      MUS.src.buffer=MUS.buf;MUS.src.loop=true;
      MUS.src.connect(MUS.gain);MUS.src.start();
    }
    return;
  }
  if(!MUS.timer){
    MUS.next=AC.currentTime+0.1;MUS.step=0;
    musScheduler();
    MUS.timer=setInterval(musScheduler,60);
  }
}
function musStop(){
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
  if(MUS.src){try{MUS.src.stop();}catch(e){}MUS.src=null;}
  if(MUS.gain){MUS.gain.disconnect();MUS.gain=null;}
}
function musToggle(){
  MUS.on=!MUS.on;
  if(MUS.on){audio();musEnsure();}else musStop();
  const b=document.getElementById("btnMus");
  if(b)b.textContent=MUS.on?"♪ Musique : en marche":"♪ Musique : coupée";
}
document.getElementById("btnMus").addEventListener("click",()=>{audio();musToggle();});
document.getElementById("fileMus").addEventListener("change",async ev=>{
  const f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  audio();
  const piste=document.getElementById("piste");
  piste.textContent="Décodage…";
  try{
    const data=await f.arrayBuffer();
    const buf=await AC.decodeAudioData(data);
    musStop();
    MUS.buf=buf;MUS.mode="fichier";MUS.on=true;
    musEnsure();
    piste.textContent=f.name+" — en boucle";
    document.getElementById("btnMus").textContent="♪ Musique : en marche";
  }catch(e){
    piste.textContent="Fichier audio illisible — essaie un .mp3, .m4a ou .ogg";
  }
});

/* ------------------------------------------------------------------ */
/* Entrées clavier + tactile                                           */
/* ------------------------------------------------------------------ */
const keys={left:false,right:false,up:false,down:false};
let attackPressed=false, anyPressed=false;
const KEYMAP={
  ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
  q:"left", d:"right", z:"up", s:"down",
  a:"left" /* qwerty secours */, w:"up",
};
addEventListener("keydown",e=>{
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;   // le joueur tape son nom
  audio();musEnsure();
  if(e.key==="m"||e.key==="M"){musToggle();return;}
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k){keys[k]=true;e.preventDefault();}
  if(e.key===" "||e.key==="Enter"){attackPressed=true;anyPressed=true;e.preventDefault();}
  else anyPressed=true;
});
addEventListener("keyup",e=>{
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k)keys[k]=false;
});
function bindBtn(id,down,up){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{audio();musEnsure();down();anyPressed=true;e.preventDefault();});
  el.addEventListener("pointerup",e=>{up&&up();e.preventDefault();});
  el.addEventListener("pointerleave",()=>{up&&up();});
}
bindBtn("tL",()=>keys.left=true, ()=>keys.left=false);
bindBtn("tR",()=>keys.right=true,()=>keys.right=false);
bindBtn("tU",()=>keys.up=true,  ()=>keys.up=false);
bindBtn("tD",()=>keys.down=true,()=>keys.down=false);
bindBtn("tA",()=>{attackPressed=true;});
cv.addEventListener("pointerdown",()=>{audio();musEnsure();anyPressed=true;});

/* ------------------------------------------------------------------ */
/* Données de jeu                                                      */
/* ------------------------------------------------------------------ */
const YMIN=372, YMAX=506;                 // bande de profondeur du trottoir
const GY0=316, GY1=474;                   // largeur navigable de la Sambre
const ZONES=[
  {
    kind:"rue", deco:"basse",
    nom:"VILLE BASSE",
    sousTitre:"Quai de la Sambre",
    intro:"Les tox tiennent le quai. Johnny a une solution : l'Uraken.",
    len:3000,
    pitas:[1180,2380],
    waves:[
      {trig:380,  compo:["tox","tox","chomeur"]},
      {trig:1050, compo:["tox","chomeur","tox","tox"]},
      {trig:1750, compo:["tox","tox","chomeur","tox","chomeur"]},
      {trig:2450, compo:["tox","chomeur","tox","tox","chomeur","tox"]},
    ],
  },
  {
    kind:"gondole",
    nom:"LA SAMBRE",
    sousTitre:"En gondole vers la ville haute",
    intro:"Une gondole sur la Sambre. Évite les débris — et ce qui flotte à côté.",
    len:4400,
    pitas:[1500,3200],
  },
  {
    kind:"rue", deco:"haute",
    nom:"VILLE HAUTE",
    sousTitre:"Place Charles II",
    intro:"Les machettes rôdent sous le beffroi. Personne ne touche à Charleroi.",
    len:3000,
    pitas:[1300,2500],
    waves:[
      {trig:380,  compo:["machette","machette","chomeur"]},
      {trig:1050, compo:["machette","machette","chomeur","tox","machette"]},
      {trig:1750, compo:["machette","chomeur","machette","machette","chomeur"]},
      {trig:2450, compo:["boss","machette","machette","chomeur"]},
    ],
  },
];
/* tir.min/max : distance à laquelle l'ennemi préfère lancer plutôt qu'avancer.
   armement : durée du coup au corps à corps. viseT : durée avant un jet.      */
const STATS={
  tox:     {hp:26, speed:62,  dmg:8,  w:34, armement:0.45, viseT:0.60, roulis:30, mort:"#8fa06a",
            tir:{min:130,max:400,cd:2.4,dmg:7, v:300,type:"seringue"}},
  chomeur: {hp:40, speed:48,  dmg:9,  w:38, armement:0.52, viseT:0.62, roulis:10, mort:"#c9a852",
            tir:{min:110,max:540,cd:2.6,dmg:8, v:290,type:"canette"}},
  machette:{hp:48, speed:112, dmg:14, w:38, armement:0.32, viseT:0.45, roulis:0,  mort:"#e05545",
            tir:{min:170,max:480,cd:2.9,dmg:12,v:380,type:"machette"}},
  boss:    {hp:340,speed:112, dmg:24, w:56, armement:0.20, viseT:0.30, roulis:0,  mort:"#c94a8a",
            tir:{min:130,max:620,cd:1.25,dmg:17,v:470,type:"machette"}},
};
const CRIS=["HEIN WAÏ !","BIESSE !","ET PAF !","DJU !","ALLEZ !","POUR CHARLEROI !"];
/* le tribunal de Charleroi salue le travail de Monsieur Cadillac */
const JUSTICE=[
  {qui:"MME LA JUGE",     mot:"« Monsieur Cadillac, pour une fois qu'on me présente du beau travail. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Je requiers… que vous continuiez, Monsieur Cadillac. »"},
  {qui:"MME LA JUGE",     mot:"« De la légitime défense à répétition ? Allez, je valide. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Le parquet de Charleroi vous félicite. Profitez, ça n'arrive jamais. »"},
  {qui:"MME LA JUGE",     mot:"« Vous au moins, Monsieur Cadillac, vous vous levez le matin. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Classé sans suite. C'était du bel ouvrage. »"},
  {qui:"MME LA JUGE",     mot:"« Si tous mes prévenus avaient votre uraken, on fermerait plus tôt. »"},
];
let justice=null; // {t, qui, mot} — l'audience en cours

let state, player, enemies, pitas, shots, epaves, floats, particles;
let zoneI, waveI, gateX, camX, shake, tGlobal=0, splashT, splashVers, introT, kills;
let runT=0, finOuvert=false, degatsRecus=0, dernierSalut=0;

function reset(){
  state="title";
  player={x:120,y:440,hp:120,maxHp:120,facing:1,
          atkT:0,cd:0,inv:0,walk:0,atkId:0,hitApplied:false,tangue:0};
  enemies=[];pitas=[];shots=[];epaves=[];floats=[];particles=[];justice=null;
  zoneI=0;waveI=0;gateX=null;camX=0;shake=0;kills=0;
  runT=0;degatsRecus=0;dernierSalut=0;
  fermerFin();
}
function startZone(i){
  zoneI=i;waveI=0;gateX=null;
  const z=ZONES[i];
  player.x=120;player.y=z.kind==="gondole"?(GY0+GY1)/2:440;
  camX=0;
  enemies=[];shots=[];epaves=[];
  /* les pita-mitraillettes posées au sol tout au long de la zone */
  pitas=(z.pitas||[]).map((px,k)=>({
    x:px,
    y:z.kind==="gondole" ? GY0+24+((k*61)%(GY1-GY0-48)) : YMIN+26+((k*47)%(YMAX-YMIN-52)),
    age:0, flotte:z.kind==="gondole",
  }));
  if(z.kind==="gondole")initGondole();
  introT=4;
  state="play";
}

const URAKEN=25;                          // l'uraken frappe toujours pareil
function urakenDmg(){return URAKEN;}

/* ------------------------------------------------------------------ */
/* Score et classement du Pays Noir                                    */
/* ------------------------------------------------------------------ */
const CLE_SCORES="johnny-cadillac-scores";
function chargerScores(){
  try{
    const brut=localStorage.getItem(CLE_SCORES);
    const arr=brut?JSON.parse(brut):[];
    return Array.isArray(arr)?arr.filter(e=>e&&typeof e.score==="number"):[];
  }catch(e){return [];}
}
function enregistrerScore(entree){
  try{
    const arr=chargerScores();
    arr.push(entree);
    arr.sort((a,b)=>b.score-a.score);
    localStorage.setItem(CLE_SCORES,JSON.stringify(arr.slice(0,20)));
    return true;
  }catch(e){return false;}
}
function chrono(t){
  const m=Math.floor(t/60), sec=Math.floor(t%60);
  return m+"'"+String(sec).padStart(2,"0")+'"';
}
/* Le score récompense la vitesse : chaque seconde coûte des points. */
function calculScore(gagne){
  const combat=kills*260;
  const vitesse=Math.max(0,Math.round(96000-runT*260));
  const propre=Math.max(0,4000-degatsRecus*12);
  return combat+vitesse+propre+(gagne?12000:0);
}

function spawnWave(w){
  const g=w.trig+470;
  gateX=g;
  w.compo.forEach((type,i)=>{
    const s=STATS[type];
    const behind=(i%3===2);           // un ennemi sur trois arrive dans le dos
    enemies.push({
      type, hp:s.hp, maxHp:s.hp,
      x: behind? w.trig-260-Math.random()*80 : g+80+i*60+Math.random()*50,
      y: YMIN+20+Math.random()*(YMAX-YMIN-40),
      windup:0, cd:0, hitFlash:0, lastHitId:-1, wob:Math.random()*7,
      kb:0, kbDir:1,
      tirCd:1.2+Math.random()*2.2, vise:0,
      dash:0, dashVx:0, dashVy:0, esqCd:0,
    });
  });
}

/* ------------------------------------------------------------------ */
/* Projectiles : seringues des tox, machettes lancées                  */
/* ------------------------------------------------------------------ */
function lancer(e,s){
  const dx=player.x-e.x, dy=player.y-e.y;
  const base=Math.atan2(dy,dx);
  const n=e.type==="boss"?3:1;              // le boss lance ses lames en gerbe
  for(let k=0;k<n;k++){
    const a=base+(k-(n-1)/2)*0.17;
    shots.push({
      x:e.x+Math.sign(dx||1)*14, y:e.y-34,
      vx:Math.cos(a)*s.tir.v, vy:Math.sin(a)*s.tir.v*0.55,
      dmg:s.tir.dmg, type:s.tir.type, rot:0, age:0,
      biere:Math.random()<0.5?"86":"carapils",
    });
  }
  sfx.lance();
}

function addFloat(x,y,txt,color){floats.push({x,y,txt,color:color||"#ece5d3",age:0});}
function burst(x,y,color,n){
  for(let i=0;i<(n||8);i++)particles.push({
    x,y,vx:(Math.random()-0.5)*260,vy:-Math.random()*180,age:0,color,
  });
}

/* ------------------------------------------------------------------ */
/* La Sambre : génération des épaves                                   */
/* ------------------------------------------------------------------ */
const NOMS_EPAVE={
  pneu:"un pneu", planche:"une palette", caddie:"un caddie",
  bidon:"un bidon", corps:"…mieux vaut ne pas regarder",
  croisiere:"un bateau-promenade — et le dîner de deux amoureux",
};
function initGondole(){
  epaves=[];
  const len=ZONES[zoneI].len;
  const types=["pneu","planche","corps","caddie","bidon"];
  const voies=4, hv=(GY1-GY0)/voies;
  let x=560,i=0;
  /* au plus deux voies sur quatre sont bouchées : un passage existe toujours */
  while(x<len-300){
    const n=1+((i*3)%2);
    const base=(i*3+((i*i)%5))%voies;
    for(let k=0;k<n;k++){
      const voie=(base+k*2)%voies;
      const cy=GY0+voie*hv+hv/2;
      epaves.push({
        x:x+k*48, y:cy, base:cy,
        t:types[(i*7+k*3+(i%3))%types.length],
        bob:((i*7+k*11)%20)/3,
        derive:((i+k)%2?1:-1)*(5+((i*13)%9)),
      });
    }
    x+=182+((i*41)%108);i++;
  }
  /* des bateaux-promenade : larges, lents, et on ne les dégage pas d'un uraken.
     On fait le vide autour pour que la voie reste franchissable. */
  [1250,2450,3560].forEach((bx,k)=>{
    epaves=epaves.filter(o=>Math.abs(o.x-bx)>170);
    const cy=GY0+[1,3,0][k]*hv+hv/2;
    epaves.push({x:bx,y:cy,base:cy,t:"croisiere",bob:k*2.1,derive:4,dw:92,dh:34});
  });
}

/* ------------------------------------------------------------------ */
/* Mise à jour                                                         */
/* ------------------------------------------------------------------ */
function ramasserPita(){
  if(player.hp>=player.maxHp)return false;      // inutile de gâcher un pita
  for(let i=pitas.length-1;i>=0;i--){
    const b=pitas[i];
    if(Math.abs(b.x-player.x)<44&&Math.abs(b.y-player.y)<38){
      player.hp=Math.min(player.maxHp,player.hp+30);
      sfx.pickup();
      addFloat(b.x,b.y-56,"Pita-mitraillette +30","#7fc46a");
      addFloat(b.x,b.y-38,"sauce andalouse · coca zéro","#8f8574");
      pitas.splice(i,1);
      return true;
    }
  }
  return false;
}
function blesser(d){
  player.hp-=d;degatsRecus+=d;player.inv=0.7;shake=6;
  sfx.hurt();
  addFloat(player.x,player.y-72,"-"+d,"#e05545");
}
function majProjectiles(dt){
  for(let i=shots.length-1;i>=0;i--){
    const sh=shots[i];
    sh.age+=dt;sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.rot+=dt*15;
    /* l'uraken dévie ce qui arrive de face : c'est la récompense du timing */
    if(player.atkT>0){
      const dxr=(sh.x-player.x)*player.facing;
      if(dxr>-24&&dxr<96&&Math.abs(sh.y-(player.y-36))<48){
        burst(sh.x,sh.y,"#ff9e1b",6);sfx.casse();
        addFloat(sh.x,sh.y-18,"DÉVIÉ !","#ff9e1b");
        shots.splice(i,1);continue;
      }
    }
    if(player.inv<=0&&Math.abs(sh.x-player.x)<24&&Math.abs(sh.y-(player.y-34))<32){
      blesser(sh.dmg);
      shots.splice(i,1);continue;
    }
    if(sh.age>5||sh.x<camX-80||sh.x>camX+W+80)shots.splice(i,1);
  }
}
function majDecor(dt){
  for(let i=floats.length-1;i>=0;i--){floats[i].age+=dt;floats[i].y-=28*dt;if(floats[i].age>1.4)floats.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;
    if(p.age>0.5)particles.splice(i,1);
  }
  for(const b of pitas){b.age+=dt;}
}
function finirZone(){
  if(zoneI<ZONES.length-1){state="splash";splashT=2.4;splashVers=zoneI+1;}
  else{state="victory";tGlobal=0;ouvrirFin(true);}
}

function update(dt){
  tGlobal+=dt;
  if(state==="title"||state==="gameover"||state==="victory"){
    /* pendant que le formulaire de score est ouvert, l'espace appartient au joueur */
    if(anyPressed&&tGlobal>0.5&&!finOuvert&&state==="title")startZone(0);
    anyPressed=false;attackPressed=false;
    return;
  }
  if(state==="splash"){
    splashT-=dt;
    if(splashT<=0)startZone(splashVers);
    anyPressed=false;attackPressed=false;
    return;
  }
  anyPressed=false;
  runT+=dt;

  const zone=ZONES[zoneI];
  if(introT>0)introT-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);

  if(zone.kind==="gondole")updateGondole(dt,zone);
  else updateRue(dt,zone);

  majProjectiles(dt);
  majDecor(dt);

  /* Tous les huit adversaires, le tribunal de Charleroi dit un mot */
  if(kills>0&&kills%8===0&&kills!==dernierSalut){
    dernierSalut=kills;
    sfx.levelup();
    const j=JUSTICE[(kills/8-1)%JUSTICE.length];
    justice={t:4.5,qui:j.qui,mot:j.mot};
  }
  if(justice){justice.t-=dt;if(justice.t<=0)justice=null;}

  if(player.hp<=0&&state==="play"){player.hp=0;state="gameover";tGlobal=0;ouvrirFin(false);}
}

/* --- La rue : ville basse et ville haute --------------------------- */
function updateRue(dt,zone){
  const sp=220;
  let dx=(keys.right?1:0)-(keys.left?1:0);
  let dy=(keys.down?1:0)-(keys.up?1:0);
  if(player.atkT>0){dx*=0.25;dy*=0.25;}
  if(dx||dy){
    const l=Math.hypot(dx,dy);
    player.x+=dx/l*sp*dt;
    player.y+=dy/l*sp*dt*0.75;
    if(dx)player.facing=dx>0?1:-1;
    player.walk+=dt*10;
  }
  player.x=Math.max(camX+30,Math.min(player.x, gateX!==null?gateX:zone.len-30));
  player.y=Math.max(YMIN,Math.min(YMAX,player.y));
  if(player.cd>0)player.cd-=dt;
  if(player.inv>0)player.inv-=dt;

  if(attackPressed){
    if(!ramasserPita()&&player.cd<=0){
      player.atkT=0.18;player.cd=0.45;player.atkId++;player.hitApplied=false;
      sfx.uraken();
      /* le boss voit le coup partir et décroche sur le côté */
      for(const e of enemies){
        if(e.type!=="boss"||e.esqCd>0||e.kb>0||e.dash>0)continue;
        if(Math.hypot(e.x-player.x,e.y-player.y)>165)continue;
        if(Math.random()>0.45)continue;
        e.dash=0.30;e.esqCd=1.30;e.vise=0;e.windup=0;
        e.dashVx=(e.x>=player.x?1:-1)*400;
        e.dashVy=(e.y<(YMIN+YMAX)/2?1:-1)*240;
        addFloat(e.x,e.y-96,"ESQUIVE","#5ad0c0");
      }
    }
  }
  attackPressed=false;

  if(player.atkT>0){
    player.atkT-=dt;
    player.x+=player.facing*130*dt;            // petite fente avant, comme au dojo
    const prog=1-player.atkT/0.18;
    if(prog>0.3&&!player.hitApplied){
      player.hitApplied=true;
      let touche=false;
      for(const e of enemies){
        if(e.dash>0)continue;                  // insaisissable pendant l'esquive
        const dxr=(e.x-player.x)*player.facing;
        if(dxr>-25&&dxr<95&&Math.abs(e.y-player.y)<44&&e.lastHitId!==player.atkId){
          e.lastHitId=player.atkId;
          e.hp-=urakenDmg();
          e.hitFlash=0.15;e.windup=0;e.vise=0;
          e.kb=260;e.kbDir=e.x>=player.x?1:-1;
          touche=true;
          burst(e.x,e.y-30,"#ff9e1b",6);
          addFloat(e.x,e.y-62,""+urakenDmg(),"#ff9e1b");
        }
      }
      if(touche){sfx.hit();shake=5;}
    }
  }

  /* --- Ennemis --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], s=STATS[e.type];
    if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.tirCd>0)e.tirCd-=dt;
    if(e.esqCd>0)e.esqCd-=dt;
    if(e.dash>0){
      e.dash-=dt;
      e.x+=e.dashVx*dt;e.y+=e.dashVy*dt;
      e.y=Math.max(YMIN,Math.min(YMAX,e.y));
      continue;
    }
    if(e.kb>0){
      e.x+=e.kbDir*e.kb*dt;
      e.kb=Math.max(0,e.kb-dt*900);
    }else if(e.vise>0){
      e.vise-=dt;                              // il arme son bras, immobile
      if(e.vise<=0){lancer(e,s);e.tirCd=s.tir.cd*(0.7+Math.random()*0.7);}
    }else if(e.windup>0){
      e.windup-=dt;
      if(e.windup<=0){
        if(Math.abs(e.x-player.x)<52&&Math.abs(e.y-player.y)<34&&player.inv<=0)blesser(s.dmg);
        e.cd=e.type==="boss"?0.38:1.1;
      }
    }else if(e.cd>0){
      e.cd-=dt;
    }else{
      const ex=player.x-e.x, ey=player.y-e.y, d=Math.hypot(ex,ey);
      if(d<44){e.windup=s.armement;}
      else if(d>s.tir.min&&d<s.tir.max&&Math.abs(ey)<80&&e.tirCd<=0){
        e.vise=s.viseT;                        // armement, lisible à l'écran
      }else{
        const wobble=s.roulis?Math.sin(tGlobal*3+e.wob)*s.roulis:0;
        e.x+=ex/d*s.speed*dt;
        e.y+=(ey/d*s.speed*0.7+wobble)*dt;
        e.y=Math.max(YMIN,Math.min(YMAX,e.y));
      }
    }
    if(e.hp<=0){
      kills++;
      sfx.kill();
      burst(e.x,e.y-30,s.mort,12);
      addFloat(e.x,e.y-50,CRIS[Math.floor(Math.random()*CRIS.length)],"#ece5d3");
      enemies.splice(i,1);
    }
  }

  /* Vagues et progression */
  if(gateX!==null&&enemies.length===0){gateX=null;sfx.go();}
  if(gateX===null&&waveI<zone.waves.length&&player.x>zone.waves[waveI].trig){
    spawnWave(zone.waves[waveI]);waveI++;
  }
  if(gateX===null&&waveI>=zone.waves.length&&player.x>zone.len-70)finirZone();

  camX=Math.max(0,Math.min(player.x-W/2+80,zone.len-W));
}

/* --- La gondole sur la Sambre -------------------------------------- */
function updateGondole(dt,zone){
  /* la gondole avance toute seule ; les flèches modulent l'allure */
  let vx=170;
  if(keys.right)vx=290;
  if(keys.left)vx=85;
  player.x+=vx*dt;
  const vy=(keys.down?1:0)-(keys.up?1:0);
  player.y+=vy*205*dt;
  player.y=Math.max(GY0,Math.min(GY1,player.y));
  player.tangue+=dt*(2.0+vx/240);
  player.facing=1;
  if(player.cd>0)player.cd-=dt;
  if(player.inv>0)player.inv-=dt;

  if(attackPressed){
    if(!ramasserPita()&&player.cd<=0){
      player.atkT=0.18;player.cd=0.45;player.atkId++;player.hitApplied=false;
      sfx.uraken();
    }
  }
  attackPressed=false;

  /* l'uraken dégage une épave de la proue — sauf un corps */
  if(player.atkT>0){
    player.atkT-=dt;
    const prog=1-player.atkT/0.18;
    if(prog>0.3&&!player.hitApplied){
      player.hitApplied=true;
      for(let i=epaves.length-1;i>=0;i--){
        const o=epaves[i];
        if(o.t==="corps"||o.t==="croisiere")continue;
        if(o.x-player.x>-24&&o.x-player.x<112&&Math.abs(o.y-player.y)<46){
          burst(o.x,o.y,"#6a7f86",12);
          addFloat(o.x,o.y-42,"DÉGAGÉ !","#ff9e1b");
          epaves.splice(i,1);sfx.casse();shake=4;
          break;
        }
      }
    }
  }

  /* dérive des épaves et collisions */
  for(const o of epaves){
    o.y=o.base+Math.sin(tGlobal*0.7+o.bob)*o.derive;
    const dx=o.x-player.x, dy=o.y-player.y;
    const lg=o.dw||46, ht=o.dh||30;
    if(player.inv<=0&&dx>-lg&&dx<lg+8&&Math.abs(dy)<ht){
      const deg=o.t==="corps"?10:(o.t==="croisiere"?20:15);
      player.hp-=deg;degatsRecus+=deg;player.inv=1.1;shake=9;
      sfx.eau();
      addFloat(player.x,player.y-74,"-"+deg,"#e05545");
      addFloat(player.x,player.y-96,NOMS_EPAVE[o.t],"#8f8574");
      burst(o.x,o.y,"#5b7a82",12);
    }
  }
  /* les pitas flottent au fil de l'eau */
  for(const b of pitas)b.y=Math.max(GY0,Math.min(GY1,b.y+Math.sin(tGlobal*0.9+b.x)*8*dt));

  if(player.x>zone.len-60)finirZone();
  camX=Math.max(0,Math.min(player.x-W/2+80,zone.len-W));
}

/* ------------------------------------------------------------------ */
/* Dessin — décors                                                     */
/* ------------------------------------------------------------------ */
function drawSky(zone){
  /* pas d'étoiles à Charleroi : trop de nuages, trop de fumée */
  const g=ctx.createLinearGradient(0,0,0,360);
  if(zone===0){g.addColorStop(0,"#0b0910");g.addColorStop(0.6,"#1a1219");g.addColorStop(0.9,"#33201c");g.addColorStop(1,"#402319");}
  else{g.addColorStop(0,"#0a0912");g.addColorStop(0.7,"#181220");g.addColorStop(0.92,"#2c1d18");g.addColorStop(1,"#33221c");}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,360);
  /* plafond de nuages bas, éclairés par en dessous */
  ctx.fillStyle="rgba(70,52,54,.30)";
  for(let i=0;i<7;i++){
    const nx=((i*260-camX*0.06+tGlobal*4)%(W+400))-200;
    ctx.beginPath();ctx.ellipse(nx,30+(i%3)*26,180,26,0,0,7);ctx.fill();
  }
  /* lueur rouge des hauts-fourneaux à l'horizon */
  const hf=ctx.createRadialGradient(W*0.72,352,20,W*0.72,352,300);
  hf.addColorStop(0,"rgba(255,90,40,"+(zone===0?0.20:0.10)+")");
  hf.addColorStop(1,"rgba(255,90,40,0)");
  ctx.fillStyle=hf;ctx.fillRect(0,0,W,360);
}
function drawPluie(){
  /* la drache carolo, fine et permanente */
  ctx.strokeStyle="rgba(190,200,215,.16)";
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<70;i++){
    const seed=i*127;
    const rx=((seed+tGlobal*260*(1+i%3*0.2))%(W+40))-20;
    const ry=((seed*7+tGlobal*640*(1+i%4*0.15))%(H+30))-15;
    ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+13);
  }
  ctx.stroke();
}
function drawIndustrie(){
  /* cheminées de la sidérurgie, très loin derrière les toits */
  const off=-camX*0.18;
  const chems=[{x:520,h:150,w:16},{x:585,h:120,w:12},{x:1210,h:165,w:18},{x:1650,h:130,w:13},{x:2100,h:155,w:16}];
  for(const c of chems){
    const bx=off+c.x;
    if(bx<-60||bx>W+60)continue;
    ctx.fillStyle="#1b1420";
    ctx.fillRect(bx,352-c.h,c.w,c.h);
    ctx.fillRect(bx-3,352-c.h,c.w+6,6);
    /* balise rouge clignotante */
    if(Math.sin(tGlobal*2+c.x)>0){ctx.fillStyle="#ff3b2f";ctx.fillRect(bx+c.w/2-2,352-c.h-5,4,4);}
    /* panache de fumée qui dérive */
    ctx.fillStyle="rgba(120,100,110,.20)";
    for(let k=0;k<4;k++){
      const t=(tGlobal*0.12+k*0.25+c.x)%1;
      ctx.beginPath();
      ctx.arc(bx+c.w/2+t*60+Math.sin(t*9)*6,352-c.h-8-t*46,6+t*14,0,7);
      ctx.fill();
    }
  }
}
function drawTourBleue(){
  /* la tour de police bleue, cylindre lumineux au-dessus des toits de la ville basse */
  const bx=1450*0.28-camX*0.28+330;
  if(bx<-120||bx>W+60)return;
  ctx.fillStyle="#24405e";
  ctx.beginPath();
  ctx.moveTo(bx,352);ctx.lineTo(bx,120);

function drawJohnny(p){
  const x=p.x-camX, y=p.y;
  shadow(x,y,20);
  ctx.save();
  ctx.translate(x,y);
  if(p.inv>0&&Math.floor(p.inv*14)%2)ctx.globalAlpha=0.35;
  const f=p.facing;

  if(p.atkT>0){
    /* URAKEN UCHI : revers du poing, coude vers la cible, détente sèche */
    const prog=1-p.atkT/0.18;
    const ext=Math.min(1,prog/0.4);                               // détente du bras
    /* fente avant */
    ctx.fillStyle="#23232a";
    ctx.fillRect(f>0?-12:4,-26,8,26);                             // jambe arrière
    ctx.fillRect(f>0?4:-12,-24,8,24);                             // jambe avant
    ctx.fillStyle="#3d2a22";
    ctx.fillRect(f>0?-15:3,-5,13,6);
    ctx.fillRect(f>0?3:-15,-4,13,6);
    ctx.fillStyle="#5a3e30";
    ctx.fillRect(f>0?-15:14,-5,3,6);
    /* buste engagé */
    ctx.fillStyle="#241f1a";ctx.fillRect(-13+f*3,-28,26,4);       // ceinturon
    ctx.fillStyle="#c9a852";ctx.fillRect(-3+f*3,-29,7,5);         // boucle
    ctx.fillStyle="#1a1a22";ctx.fillRect(-13+f*3,-54,26,30);
    ctx.fillStyle="#ece5d3";ctx.fillRect(-4+f*3,-52,8,14);
    ctx.fillStyle="#ffd45a";                                      // la croix qui vole
    ctx.fillRect(-1+f*5,-49,2,7);ctx.fillRect(-3+f*5,-47,6,2);
    ctx.fillStyle="#2c2c36";ctx.fillRect(-13+f*3,-54,26,4);
    /* bras de garde replié devant la poitrine */
    ctx.fillStyle="#1a1a22";ctx.fillRect(f>0?-11:-1,-48,12,8);
    /* le bras qui fouette : dos du poing vers l'avant */
    const reach=10+26*ext;
    /* avant-bras fin, manche de perfecto */
    ctx.fillStyle="#1a1a22";
    if(f>0)ctx.fillRect(5,-51,reach,7); else ctx.fillRect(-5-reach,-51,reach,7);
    ctx.fillStyle="#2c2c36";                                      // pli de la manche
    if(f>0)ctx.fillRect(5,-51,reach,2); else ctx.fillRect(-5-reach,-51,reach,2);
    /* le dos du poing : c'est lui qui frappe */
    ctx.fillStyle="#c99a6e";
    if(f>0)ctx.fillRect(5+reach,-53,10,11); else ctx.fillRect(-15-reach,-53,10,11);
    ctx.fillStyle="#a87a50";                                      // phalanges
    if(f>0)ctx.fillRect(12+reach,-53,3,11); else ctx.fillRect(-15-reach,-53,3,11);
    ctx.fillStyle="#c9a852";                                      // chevalière
    if(f>0)ctx.fillRect(10+reach,-49,2,2); else ctx.fillRect(-12-reach,-49,2,2);
    /* traits de vitesse — le coup le plus rapide du monde */
    if(ext>0.6){
      ctx.fillStyle="rgba(255,158,27,.9)";
      for(let i=0;i<3;i++){
        const lx=f>0? reach+18 : -reach-40;
        ctx.fillRect(lx,-55+i*7,22,2);
      }
      ctx.fillStyle="rgba(255,158,27,.18)";                       // sillage discret
      if(f>0)ctx.fillRect(5,-49,reach,3); else ctx.fillRect(-5-reach,-49,reach,3);
    }
    ctx.save();ctx.translate(f*3,0);johnnyHead(f);ctx.restore();
    ctx.restore();
    return;
  }

  const step=Math.sin(p.walk)*((keys.left||keys.right||keys.up||keys.down)?1:0);
  johnnyBody(step);
  /* bras le long du perfecto */
  ctx.fillStyle="#1a1a22";
  ctx.fillRect(f>0?9:-17,-50,8,20);
  ctx.fillStyle="#d8a878";
  ctx.fillRect(f>0?9:-17,-31,8,7);
  johnnyHead(f);
  ctx.restore();
}

  ctx.fillRect(-59,-16,5,22);
  ctx.restore();
  /* Johnny debout, et sa rame */
  ctx.save();ctx.translate(0,tang-8);
  drawJohnny({x:p.x-8,y:p.y,facing:1,atkT:p.atkT,inv:p.inv,walk:0,hitApplied:p.hitApplied});
  const rem=Math.sin(p.tangue*0.9)*10;
  ctx.strokeStyle="#5a4630";ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x-22,y-46);ctx.lineTo(x-58,y+18+rem);
  ctx.stroke();
  ctx.fillStyle="#4a3a26";
  ctx.beginPath();ctx.ellipse(x-60,y+22+rem,7,4,-0.5,0,7);ctx.fill();
  ctx.restore();
}

/* ------------------------------------------------------------------ */
/* Dessin — HUD et écrans                                              */
/* ------------------------------------------------------------------ */
function txt(t,x,y,size,color,align,glow){
  ctx.save();
  ctx.font="bold "+size+"px 'Courier New',monospace";
  ctx.textAlign=align||"left";
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=14;}
  ctx.fillStyle=color;
  ctx.fillText(t,x,y);
  ctx.restore();
}
function drawHUD(){
  const zone=ZONES[zoneI];
  /* cartouche Johnny */
  ctx.fillStyle="rgba(12,10,8,.72)";
  ctx.fillRect(14,12,300,74);
  ctx.strokeStyle="#2b241c";ctx.strokeRect(14,12,300,74);
  txt("JOHNNY CADILLAC",26,34,15,"#ece5d3");
  txt(kills+" AU TAPIS",296,34,13,"#ff9e1b","right");
  /* PV */
  ctx.fillStyle="#241d18";ctx.fillRect(26,44,270,12);
  ctx.fillStyle=player.hp/player.maxHp>0.35?"#e05545":"#ff2f1e";
  ctx.fillRect(26,44,270*Math.min(1,Math.max(0,player.hp/player.maxHp)),12);
  txt("PV",26,42,9,"#8f8574");
  txt(Math.max(0,Math.ceil(player.hp))+" / "+player.maxHp,296,54,10,"#8f8574","right");
  /* zone, chrono, adversaires */
  txt(zone.nom,W-20,34,15,"#ece5d3","right");
  txt(zone.sousTitre,W-20,52,11,"#8f8574","right");
  txt(chrono(runT),W-20,72,14,"#c9a852","right");
  if(zone.kind==="gondole"){
    /* jauge de traversée de la Sambre */
    const pr=Math.max(0,Math.min(1,player.x/(zone.len-60)));
    ctx.fillStyle="rgba(12,10,8,.6)";ctx.fillRect(W-232,80,212,9);
    ctx.fillStyle="#5ad0c0";ctx.fillRect(W-230,82,208*pr,5);
    txt("TRAVERSÉE",W-20,102,10,"#5ad0c0","right");
  }else if(enemies.length)txt(enemies.length+" en face",W-20,102,11,"#e05545","right");

  if(introT>0&&introT<3.6){
    ctx.fillStyle="rgba(12,10,8,.7)";
    ctx.fillRect(W/2-330,96,660,40);
    txt(zone.intro,W/2,121,13,"#ece5d3","center");
  }
  if(zone.kind!=="gondole"&&gateX===null&&enemies.length===0&&Math.sin(tGlobal*6)>0){
    txt("AVANCE  ▶",W-40,H-30,20,"#ff9e1b","right","#ff9e1b");
  }
  /* l'audience : compliment du tribunal de Charleroi */
  if(justice){
    const a=Math.min(1,justice.t/0.4,(4.5-justice.t)/0.3);
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle="rgba(16,12,9,.92)";
    ctx.fillRect(W/2-370,150,740,64);
    ctx.strokeStyle="#c9a852";ctx.lineWidth=2;
    ctx.strokeRect(W/2-370,150,740,64);
    txt("⚖",W/2-346,190,26,"#c9a852");
    txt("TRIBUNAL DE CHARLEROI — "+justice.qui,W/2-310,172,12,"#c9a852");
    txt(justice.mot,W/2-310,196,13,"#ece5d3");
    ctx.restore();
  }
  if(player.cd>0&&player.atkT<=0){
    ctx.fillStyle="rgba(236,229,211,.25)";
    ctx.fillRect(26,80,60*(player.cd/0.45),3);
  }
}
function drawTitle(){
  drawSky(0);drawTerrils();drawIndustrie();drawTourBleue();drawBuildingsBasse();drawStreet(0);
  drawPluie();
  ctx.fillStyle="rgba(12,10,8,.55)";ctx.fillRect(0,0,W,H);
  const bounce=Math.sin(tGlobal*2)*4;
  txt("JOHNNY CADILLAC",W/2,180+bounce,58,"#ff9e1b","center","#ff9e1b");
  txt("le coup de poing le plus rapide du monde",W/2,222+bounce,18,"#ece5d3","center");
  /* Johnny en pied, plein cadre */
  ctx.save();ctx.translate(0,60);ctx.scale(1.6,1.6);
  drawJohnny({x:camX+W/2/1.6,y:250,facing:1,atkT:0,inv:0,walk:tGlobal*4});
  ctx.restore();
  txt("Ville Basse : les tox  ·  La Sambre en gondole  ·  Ville Haute : les machettes",W/2,436,13,"#8f8574","center");
  txt("ZQSD / flèches : bouger      ESPACE : URAKEN et ramasser",W/2,462,14,"#ece5d3","center");
  txt("Ils lancent seringues et machettes — l'uraken les dévie.",W/2,484,12,"#5ad0c0","center");
  if(Math.sin(tGlobal*5)>0)txt("— APPUIE SUR ESPACE —",W/2,508,17,"#ff9e1b","center");
}
function drawSplash(){
  ctx.fillStyle="#0c0a08";ctx.fillRect(0,0,W,H);
  const z=ZONES[splashVers];
  const fait=["LA VILLE BASSE EST NETTOYÉE","LA SAMBRE EST DERRIÈRE TOI"][splashVers-1]||"";
  txt(fait,W/2,214,22,"#ece5d3","center");
  txt(z.nom,W/2,290,52,"#ff9e1b","center","#ff9e1b");
  txt(z.sousTitre,W/2,330,15,"#8f8574","center");
  txt("Chrono : "+chrono(runT),W/2,378,14,"#c9a852","center");
}
function drawGameover(){
  ctx.fillStyle="rgba(12,10,8,.8)";ctx.fillRect(0,0,W,H);
  txt("T'ES TOMBÉ, FIEU…",W/2,230,44,"#e05545","center");
  txt("Charleroi se souviendra quand même de toi.",W/2,280,15,"#ece5d3","center");
}
function drawVictory(){
  drawSky(1);drawTerrils();drawIndustrie();drawDomeStChristophe();drawBeffroi();drawBuildingsHaute();drawStreet(1);
  drawPluie();
  ctx.fillStyle="rgba(12,10,8,.6)";ctx.fillRect(0,0,W,H);
  txt("CHARLEROI EST NETTOYÉE",W/2,196,40,"#ff9e1b","center","#ff9e1b");
  txt("Johnny Cadillac, légende du Pays Noir",W/2,240,18,"#ece5d3","center");
  txt("Le tribunal classe le dossier sans suite.",W/2,264,13,"#c9a852","center");
  ctx.save();ctx.translate(0,80);ctx.scale(1.6,1.6);
  drawJohnny({x:camX+W/2/1.6,y:230,facing:1,atkT:0.18*(1-((tGlobal*2)%1)),inv:0,walk:0,hitApplied:true});
  ctx.restore();
  txt("Mis au tapis : "+kills+"   ·   Chrono : "+chrono(runT),W/2,452,14,"#8f8574","center");
}

/* ------------------------------------------------------------------ */
/* Boucle                                                              */
/* ------------------------------------------------------------------ */
/* signal d'armement : l'ennemi va lancer, on a le temps de s'écarter */
function telegraphe(e,x,y){
  if(e.vise>0&&Math.sin(tGlobal*24)>-0.2){
    ctx.fillStyle="#5ad0c0";
    ctx.fillRect(x-15,y-86,30,4);
    txt({tox:"SERINGUE",chomeur:"CANETTE"}[e.type]||"MACHETTE",x,y-92,9,"#5ad0c0","center");
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==="title"){drawTitle();return;}
  if(state==="splash"){drawSplash();return;}
  if(state==="victory"){drawVictory();return;}

  const zone=ZONES[zoneI];
  const scene=[];
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2);

  if(zone.kind==="gondole"){
    drawSky(0);drawTerrils();drawIndustrie();drawBergeLointaine();drawQuaiFigures();drawPonts();drawEau();
    for(const o of epaves)scene.push({y:o.y,fn:()=>drawEpave(o)});
    for(const b of pitas)scene.push({y:b.y,fn:()=>drawPita(b)});
    scene.push({y:player.y,fn:()=>drawGondole(player)});
  }else{
    const basse=zone.deco==="basse";
    drawSky(basse?0:1);
    drawTerrils();
    drawIndustrie();
    if(basse)drawTourBleue();
    else{drawDomeStChristophe();drawBeffroi();}
    (basse?drawBuildingsBasse:drawBuildingsHaute)();
    drawStreet(basse?0:1);
    for(const b of pitas)scene.push({y:b.y,fn:()=>drawPita(b)});
    for(const e of enemies)scene.push({y:e.y,fn:()=>{
      /* image rémanente : on lit l'esquive du boss au premier coup d'œil */
      if(e.dash>0){
        const ox=e.x, oy=e.y;
        ctx.save();ctx.globalAlpha=0.30;
        e.x-=e.dashVx*0.07;e.y-=e.dashVy*0.07;
        drawMachette(e,true);
        ctx.restore();
        e.x=ox;e.y=oy;
      }
      if(e.type==="tox")drawTox(e);
      else if(e.type==="chomeur")drawChomeur(e);
      else drawMachette(e,e.type==="boss");
      telegraphe(e,e.x-camX,e.y);
    }});
    scene.push({y:player.y,fn:()=>drawJohnny(player)});
  }
  /* tri par profondeur : plus bas = devant */
  scene.sort((a,b)=>a.y-b.y).forEach(s=>s.fn());

  for(const sh of shots)drawShot(sh);

  for(const p of particles){
    ctx.globalAlpha=1-p.age*2;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-camX-2,p.y-2,4,4);
    ctx.globalAlpha=1;
  }
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,2-f.age*1.4);
    txt(f.txt,f.x-camX,f.y,13,f.color,"center");
    ctx.globalAlpha=1;
  }
  drawPluie();
  ctx.restore();

  /* voile de crasse et vignettage : rien ne brille jamais tout à fait ici */
  const vg=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,620);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(62,54,48,.10)";ctx.fillRect(0,0,W,H);

  drawHUD();
  if(state==="gameover")drawGameover();
}

/* ------------------------------------------------------------------ */
/* Écran de fin : score, saisie du nom, classement du Pays Noir        */
/* ------------------------------------------------------------------ */
const elFin=document.getElementById("fin");
const elFinTitre=document.getElementById("finTitre");
const elFinSous=document.getElementById("finSous");
const elFinScore=document.getElementById("finScore");
const elFinDetail=document.getElementById("finDetail");
const elFinForm=document.getElementById("finForm");
const elFinNom=document.getElementById("finNom");
const elFinTableau=document.getElementById("finTableau");
const elFinVide=document.getElementById("finVide");
let scoreCourant=0, gagneCourant=false;

function afficherClassement(idSurligne){
  const arr=chargerScores();
  elFinTableau.textContent="";
  elFinVide.hidden=arr.length>0;
  arr.slice(0,10).forEach((e,i)=>{
    const li=document.createElement("li");
    if(idSurligne&&e.id===idSurligne)li.className="moi";
    const r=document.createElement("span");r.className="rang";r.textContent=(i+1)+".";
    /* textContent : un pseudo enregistré reste du texte, jamais du balisage */
    const n=document.createElement("span");n.textContent=e.nom||"—";
    const t=document.createElement("span");t.className="tps";t.textContent=chrono(e.temps||0);
    const pt=document.createElement("span");pt.className="pts";
    pt.textContent=(e.score||0).toLocaleString("fr-BE");
    li.append(r,n,t,pt);
    elFinTableau.appendChild(li);
  });
}
function ouvrirFin(gagne){
  gagneCourant=gagne;
  scoreCourant=calculScore(gagne);
  finOuvert=true;
  elFinTitre.textContent=gagne?"Charleroi est nettoyée":"T'es tombé, fieu…";
  elFinSous.textContent=gagne
    ? "Le tribunal classe le dossier sans suite. Johnny rentre à pied sous la drache."
    : "La ville a eu le dernier mot. Elle a l'habitude.";
  elFinScore.textContent=scoreCourant.toLocaleString("fr-BE");
  const sm=document.createElement("small");sm.textContent="Points";
  elFinScore.appendChild(sm);
  elFinDetail.textContent="";
  [["Temps",chrono(runT)],["Au tapis",kills],
   ["Dégâts pris",degatsRecus]].forEach(pair=>{
    const d=document.createElement("div");
    const b=document.createElement("b");b.textContent=pair[1];
    d.appendChild(b);d.appendChild(document.createTextNode(pair[0]));
    elFinDetail.appendChild(d);
  });
  elFinForm.hidden=false;
  elFinVide.textContent="Personne au tableau. Sois le premier.";
  try{elFinNom.value=localStorage.getItem("johnny-cadillac-nom")||"";}catch(e){}
  afficherClassement(null);
  elFin.hidden=false;
  setTimeout(()=>{try{elFinNom.focus();}catch(e){}},80);
}
function fermerFin(){
  finOuvert=false;
  if(typeof elFin!=="undefined"&&elFin)elFin.hidden=true;
}
elFinForm.addEventListener("submit",ev=>{
  ev.preventDefault();
  const nom=(elFinNom.value||"").trim().slice(0,14)||"Anonyme";
  const entree={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    nom, score:scoreCourant, temps:Math.round(runT),
    kills:kills, gagne:gagneCourant,
  };
  const ok=enregistrerScore(entree);
  try{localStorage.setItem("johnny-cadillac-nom",nom);}catch(e){}
  elFinForm.hidden=true;
  afficherClassement(entree.id);
  if(!ok){
    elFinVide.textContent="Score non enregistré : cet appareil bloque le stockage local.";
    elFinVide.hidden=false;
  }
});
document.getElementById("finRejouer").addEventListener("click",()=>{
  fermerFin();
  reset();
  tGlobal=0;
  startZone(0);
});

reset();

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
