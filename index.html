<meta charset="utf-8">
<title>Johnny Cadillac</title>
<style>
  /* Monde arcade nocturne assumé : thème unique, tout est peint explicitement. */
  :root{
    --charbon:#0c0a08;
    --suie:#16130f;
    --sodium:#ff9e1b;
    --craie:#ece5d3;
    --brique:#b04a35;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--charbon);
    color:var(--craie);
    font-family:"Courier New",ui-monospace,monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px;
    box-sizing:border-box;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:min(100%,960px);
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    background:var(--suie);
    border:3px solid #2b241c;
    border-radius:4px;
    box-shadow:0 0 40px rgba(255,158,27,.12), 0 12px 40px rgba(0,0,0,.6);
    image-rendering:pixelated;
  }
  #hint{
    font-size:12px;
    letter-spacing:.12em;
    color:#8f8574;
    text-transform:uppercase;
    text-align:center;
  }
  #bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  #bar button,#bar label{
    font-family:inherit;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#c9a852;
    background:rgba(201,168,82,.08);
    border:1px solid rgba(201,168,82,.45);
    border-radius:3px;
    padding:6px 12px;
    cursor:pointer;
  }
  #bar button:hover,#bar label:hover{background:rgba(201,168,82,.20);}
  #bar button:focus-visible,#bar label:focus-within{outline:2px solid #ff9e1b;outline-offset:2px;}
  #bar input[type=file]{display:none;}
  #piste{color:#8f8574;text-transform:none;letter-spacing:0;}
  /* Contrôles tactiles : n'apparaissent que sur écran tactile */
  #touch{display:none;}
  @media (pointer:coarse){
    #touch{display:block;}
    #hint{display:none;}
  }
  .tbtn{
    position:absolute;
    bottom:10px;
    width:64px;height:64px;
    border-radius:50%;
    background:rgba(236,229,211,.10);
    border:2px solid rgba(236,229,211,.35);
    color:var(--craie);
    font-family:inherit;font-weight:bold;font-size:22px;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  .tbtn:active{background:rgba(255,158,27,.35);}
  #tL{left:14px;}
  #tR{left:92px;}
  #tU{left:53px;bottom:88px;}
  #tD{left:53px;bottom:-4px;display:none;}
  #tA{
    right:14px;
    width:92px;height:92px;
    background:rgba(255,158,27,.22);
    border-color:var(--sodium);
    color:var(--sodium);
    font-size:13px;
    letter-spacing:.08em;
  }
</style>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <button class="tbtn" id="tL">◀</button>
    <button class="tbtn" id="tR">▶</button>
    <button class="tbtn" id="tU">▲</button>
    <button class="tbtn" id="tD">▼</button>
    <button class="tbtn" id="tA">URAKEN</button>
  </div>
</div>
<div id="hint">ZQSD ou flèches : bouger &nbsp;·&nbsp; Espace : Uraken &nbsp;·&nbsp; M : musique</div>
<div id="bar">
  <button id="btnMus" type="button">♪ Musique : en marche</button>
  <label for="fileMus" tabindex="0">Charger ta musique…</label>
  <input id="fileMus" type="file" accept="audio/*">
  <span id="piste">Fanfare du Pays Noir — instrumental original</span>
</div>

<script>
"use strict";
const W=960, H=540;
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");

/* ------------------------------------------------------------------ */
/* Audio : petits bruitages synthétiques, créés au premier input       */
/* ------------------------------------------------------------------ */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); }
function beep(freq,dur,type,vol,slide){
  if(!AC)return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function whoosh(){
  if(!AC)return;
  const n=AC.sampleRate*0.25, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime;
  s.buffer=buf; f.type="bandpass"; f.frequency.setValueAtTime(500,t);
  f.frequency.exponentialRampToValueAtTime(2400,t+0.22);
  g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
const sfx={
  uraken(){ whoosh(); },
  hit(){ beep(120,0.09,"square",0.18,-60); },
  kill(){ beep(300,0.2,"sawtooth",0.12,-240); },
  hurt(){ beep(90,0.18,"sawtooth",0.16,-40); },
  pickup(){ beep(520,0.08,"square",0.10); setTimeout(()=>beep(780,0.10,"square",0.10),80); },
  levelup(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.12,"square",0.10),i*90)); },
  go(){ beep(660,0.08,"square",0.08); },
};

/* ------------------------------------------------------------------ */
/* Musique — fanfare de marche originale, synthétisée à la volée.      */
/* L'hymne « Pays de Charleroi » (1867) est libre de droits, mais tout */
/* enregistrement récent ne l'est pas : d'où ce morceau original, et   */
/* le bouton qui permet de charger sa propre piste depuis son disque.  */
/* ------------------------------------------------------------------ */
const hz=m=>440*Math.pow(2,(m-69)/12);
const R=null;
/* 8 mesures à 4 temps — [note MIDI, durée en temps] */
const MELODIE=[
  [69,1],[69,.5],[69,.5],[74,2],
  [77,1],[76,1],[74,1],[72,1],
  [74,1],[69,.5],[69,.5],[65,2],
  [67,1],[69,1],[70,2],
  [69,1],[69,.5],[69,.5],[74,2],
  [77,1],[79,1],[81,2],
  [79,1],[77,1],[76,1],[74,1],
  [74,2],[R,2],
];
/* accords par mesure : fondamentale, quinte, et les notes de l'accord */
const GRILLE=[
  {b:50,acc:[62,65,69]},  // Dm
  {b:50,acc:[62,65,69]},  // Dm
  {b:46,acc:[58,62,65]},  // Bb
  {b:43,acc:[55,58,62]},  // Gm
  {b:50,acc:[62,65,69]},  // Dm
  {b:46,acc:[58,62,65]},  // Bb
  {b:45,acc:[57,61,64]},  // A7
  {b:50,acc:[62,65,69]},  // Dm
];
const MUS={on:true,gain:null,timer:null,next:0,step:0,src:null,buf:null,mode:"fanfare"};
const TEMPO=104, BEAT=60/TEMPO;

function musNote(t,freq,dur,type,vol,cutoff){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.setValueAtTime(vol,t+dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  let node=o;
  if(cutoff){
    const f=AC.createBiquadFilter();
    f.type="lowpass";f.frequency.setValueAtTime(cutoff,t);
    o.connect(f);node=f;
  }
  node.connect(g).connect(MUS.gain);
  o.start(t);o.stop(t+dur+0.05);
}
function musDrum(t,kind){
  if(kind==="kick"){
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="sine";o.frequency.setValueAtTime(110,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    g.gain.setValueAtTime(0.5,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    o.connect(g).connect(MUS.gain);o.start(t);o.stop(t+0.18);
  }else{
    const n=Math.floor(AC.sampleRate*0.13), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    s.buffer=buf;f.type="highpass";f.frequency.setValueAtTime(1400,t);
    g.gain.setValueAtTime(0.30,t);
    s.connect(f).connect(g).connect(MUS.gain);s.start(t);
  }
}
/* index de départ de chaque note de la mélodie, en temps */
const MEL_POS=(()=>{let p=0;return MELODIE.map(n=>{const s=p;p+=n[1];return s;});})();
const BOUCLE=32; // 8 mesures × 4 temps

function musScheduler(){
  if(!AC||!MUS.gain)return;
  while(MUS.next<AC.currentTime+0.25){
    const beat=MUS.step%BOUCLE;
    const mes=Math.floor(beat/4), t=MUS.next;
    const ch=GRILLE[mes];
    /* oom-pah : basse de tuba sur 1 et 3, contretemps de cuivres sur 2 et 4 */
    if(beat%2===0){
      musNote(t,hz(beat%4===0?ch.b:ch.b+7),BEAT*0.75,"triangle",0.30,420);
      musDrum(t,"kick");
    }else{
      ch.acc.forEach(n=>musNote(t,hz(n),BEAT*0.42,"sawtooth",0.055,1500));
      musDrum(t,"snare");
    }
    /* la mélodie de fanfare, deux voix à l'octave */
    MELODIE.forEach((n,i)=>{
      if(n[0]===R||MEL_POS[i]!==beat)return;
      const d=n[1]*BEAT*0.92;
      musNote(t,hz(n[0]),d,"square",0.085,2600);
      musNote(t,hz(n[0]-12),d,"triangle",0.055,1200);
    });
    MUS.next+=BEAT;MUS.step++;
  }
}
function musEnsure(){
  if(!AC||!MUS.on)return;
  if(!MUS.gain){
    MUS.gain=AC.createGain();
    MUS.gain.gain.value=0.5;
    MUS.gain.connect(AC.destination);
  }
  if(MUS.mode==="fichier"){
    if(!MUS.src&&MUS.buf){
      MUS.src=AC.createBufferSource();
      MUS.src.buffer=MUS.buf;MUS.src.loop=true;
      MUS.src.connect(MUS.gain);MUS.src.start();
    }
    return;
  }
  if(!MUS.timer){
    MUS.next=AC.currentTime+0.1;MUS.step=0;
    musScheduler();
    MUS.timer=setInterval(musScheduler,60);
  }
}
function musStop(){
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
  if(MUS.src){try{MUS.src.stop();}catch(e){}MUS.src=null;}
  if(MUS.gain){MUS.gain.disconnect();MUS.gain=null;}
}
function musToggle(){
  MUS.on=!MUS.on;
  if(MUS.on){audio();musEnsure();}else musStop();
  const b=document.getElementById("btnMus");
  if(b)b.textContent=MUS.on?"♪ Musique : en marche":"♪ Musique : coupée";
}
document.getElementById("btnMus").addEventListener("click",()=>{audio();musToggle();});
document.getElementById("fileMus").addEventListener("change",async ev=>{
  const f=ev.target.files&&ev.target.files[0];
  if(!f)return;
  audio();
  const piste=document.getElementById("piste");
  piste.textContent="Décodage…";
  try{
    const data=await f.arrayBuffer();
    const buf=await AC.decodeAudioData(data);
    musStop();
    MUS.buf=buf;MUS.mode="fichier";MUS.on=true;
    musEnsure();
    piste.textContent=f.name+" — en boucle";
    document.getElementById("btnMus").textContent="♪ Musique : en marche";
  }catch(e){
    piste.textContent="Fichier audio illisible — essaie un .mp3, .m4a ou .ogg";
  }
});

/* ------------------------------------------------------------------ */
/* Entrées clavier + tactile                                           */
/* ------------------------------------------------------------------ */
const keys={left:false,right:false,up:false,down:false};
let attackPressed=false, anyPressed=false;
const KEYMAP={
  ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
  q:"left", d:"right", z:"up", s:"down",
  a:"left" /* qwerty secours */, w:"up",
};
addEventListener("keydown",e=>{
  audio();musEnsure();
  if(e.key==="m"||e.key==="M"){musToggle();return;}
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k){keys[k]=true;e.preventDefault();}
  if(e.key===" "||e.key==="Enter"){attackPressed=true;anyPressed=true;e.preventDefault();}
  else anyPressed=true;
});
addEventListener("keyup",e=>{
  const k=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(k)keys[k]=false;
});
function bindBtn(id,down,up){
  const el=document.getElementById(id);
  el.addEventListener("pointerdown",e=>{audio();musEnsure();down();anyPressed=true;e.preventDefault();});
  el.addEventListener("pointerup",e=>{up&&up();e.preventDefault();});
  el.addEventListener("pointerleave",()=>{up&&up();});
}
bindBtn("tL",()=>keys.left=true, ()=>keys.left=false);
bindBtn("tR",()=>keys.right=true,()=>keys.right=false);
bindBtn("tU",()=>keys.up=true,  ()=>keys.up=false);
bindBtn("tD",()=>keys.down=true,()=>keys.down=false);
bindBtn("tA",()=>{attackPressed=true;});
cv.addEventListener("pointerdown",()=>{audio();musEnsure();anyPressed=true;});

/* ------------------------------------------------------------------ */
/* Données de jeu                                                      */
/* ------------------------------------------------------------------ */
const YMIN=372, YMAX=506;                 // bande de profondeur du trottoir
const ZONES=[
  {
    nom:"VILLE BASSE",
    sousTitre:"Quai de la Sambre",
    intro:"Les tox tiennent le quai. Johnny a une solution : l'Uraken.",
    len:2800,
    waves:[
      {trig:380,  compo:["tox","tox"]},
      {trig:1000, compo:["tox","tox","tox"]},
      {trig:1650, compo:["tox","tox","tox","tox"]},
      {trig:2300, compo:["tox","tox","tox","tox","tox"]},
    ],
  },
  {
    nom:"VILLE HAUTE",
    sousTitre:"Place Charles II",
    intro:"Les machettes rôdent sous le beffroi. Personne ne touche à Charleroi.",
    len:2800,
    waves:[
      {trig:380,  compo:["machette","machette"]},
      {trig:1000, compo:["machette","machette","machette"]},
      {trig:1650, compo:["machette","machette","machette","machette"]},
      {trig:2300, compo:["boss","machette","machette"]},
    ],
  },
];
const STATS={
  tox:     {hp:26, speed:62,  dmg:8,  xp:12,  w:34},
  machette:{hp:48, speed:112, dmg:14, xp:25,  w:38},
  boss:    {hp:330,speed:88,  dmg:22, xp:120, w:56},
};
const CRIS=["HEIN WAÏ !","BIESSE !","ET PAF !","DJU !","ALLEZ !","POUR CHARLEROI !"];
/* le tribunal de Charleroi salue le travail de Monsieur Cadillac */
const JUSTICE=[
  {qui:"MME LA JUGE",     mot:"« Monsieur Cadillac, pour une fois qu'on me présente du beau travail. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Je requiers… que vous continuiez, Monsieur Cadillac. »"},
  {qui:"MME LA JUGE",     mot:"« De la légitime défense à répétition ? Allez, je valide. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Le parquet de Charleroi vous félicite. Profitez, ça n'arrive jamais. »"},
  {qui:"MME LA JUGE",     mot:"« Vous au moins, Monsieur Cadillac, vous vous levez le matin. »"},
  {qui:"LE PROCUREUR DU ROI", mot:"« Classé sans suite. C'était du bel ouvrage. »"},
  {qui:"MME LA JUGE",     mot:"« Si tous mes prévenus avaient votre uraken, on fermerait plus tôt. »"},
];
let justice=null; // {t, qui, mot} — l'audience en cours

let state, player, enemies, drops, floats, particles;
let zoneI, waveI, gateX, camX, shake, tGlobal=0, splashT, introT, kills;

function reset(){
  state="title";
  player={x:120,y:440,hp:100,maxHp:100,xp:0,level:1,facing:1,
          atkT:0,cd:0,inv:0,walk:0,atkId:0,hitApplied:false};
  enemies=[];drops=[];floats=[];particles=[];justice=null;
  zoneI=0;waveI=0;gateX=null;camX=0;shake=0;kills=0;
}
function startZone(i){
  zoneI=i;waveI=0;gateX=null;
  player.x=120;player.y=440;camX=0;
  enemies=[];drops=[];
  introT=4;
  state="play";
}
reset();

function urakenDmg(){return 15+(player.level-1)*5;}
function xpNext(){return player.level*60;}

function spawnWave(w){
  const g=w.trig+470;
  gateX=g;
  w.compo.forEach((type,i)=>{
    const s=STATS[type];
    const behind=(i%3===2);           // un ennemi sur trois arrive dans le dos
    enemies.push({
      type, hp:s.hp, maxHp:s.hp,
      x: behind? w.trig-260-Math.random()*80 : g+80+i*60+Math.random()*50,
      y: YMIN+20+Math.random()*(YMAX-YMIN-40),
      windup:0, cd:0, hitFlash:0, lastHitId:-1, wob:Math.random()*7,
      kb:0, kbDir:1,
    });
  });
}

function addFloat(x,y,txt,color){floats.push({x,y,txt,color:color||"#ece5d3",age:0});}
function burst(x,y,color,n){
  for(let i=0;i<(n||8);i++)particles.push({
    x,y,vx:(Math.random()-0.5)*260,vy:-Math.random()*180,age:0,color,
  });
}

/* ------------------------------------------------------------------ */
/* Mise à jour                                                         */
/* ------------------------------------------------------------------ */
function update(dt){
  tGlobal+=dt;
  if(state==="title"||state==="gameover"||state==="victory"){
    if(anyPressed&&tGlobal>0.5){
      if(state==="title"){startZone(0);}
      else{reset();tGlobal=0;}
    }
    anyPressed=false;attackPressed=false;
    return;
  }
  if(state==="splash"){
    splashT-=dt;
    if(splashT<=0)startZone(1);
    anyPressed=false;attackPressed=false;
    return;
  }
  anyPressed=false;

  const zone=ZONES[zoneI];
  if(introT>0)introT-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*22);

  /* --- Johnny --- */
  const sp=220;
  let dx=(keys.right?1:0)-(keys.left?1:0);
  let dy=(keys.down?1:0)-(keys.up?1:0);
  if(player.atkT>0){dx*=0.25;dy*=0.25;}
  if(dx||dy){
    const l=Math.hypot(dx,dy);
    player.x+=dx/l*sp*dt;
    player.y+=dy/l*sp*dt*0.75;
    if(dx)player.facing=dx>0?1:-1;
    player.walk+=dt*10;
  }
  player.x=Math.max(camX+30,Math.min(player.x, gateX!==null?gateX:zone.len-30));
  player.y=Math.max(YMIN,Math.min(YMAX,player.y));
  if(player.cd>0)player.cd-=dt;
  if(player.inv>0)player.inv-=dt;

  if(attackPressed&&player.cd<=0){
    player.atkT=0.18;player.cd=0.45;player.atkId++;player.hitApplied=false;
    sfx.uraken();
  }
  attackPressed=false;

  if(player.atkT>0){
    player.atkT-=dt;
    player.x+=player.facing*130*dt;            // petite fente avant, comme au dojo
    const prog=1-player.atkT/0.18;
    if(prog>0.3&&!player.hitApplied){
      player.hitApplied=true;
      let touche=false;
      for(const e of enemies){
        const dxr=(e.x-player.x)*player.facing;
        if(dxr>-25&&dxr<95&&Math.abs(e.y-player.y)<44&&e.lastHitId!==player.atkId){
          e.lastHitId=player.atkId;
          e.hp-=urakenDmg();
          e.hitFlash=0.15;e.windup=0;
          e.kb=260;e.kbDir=e.x>=player.x?1:-1;
          touche=true;
          burst(e.x,e.y-30,"#ff9e1b",6);
          addFloat(e.x,e.y-62,""+urakenDmg(),"#ff9e1b");
        }
      }
      if(touche){sfx.hit();shake=5;}
    }
  }

  /* --- Ennemis --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i], s=STATS[e.type];
    if(e.hitFlash>0)e.hitFlash-=dt;
    if(e.kb>0){
      e.x+=e.kbDir*e.kb*dt;
      e.kb=Math.max(0,e.kb-dt*900);
    }else if(e.windup>0){
      e.windup-=dt;
      if(e.windup<=0){
        if(Math.abs(e.x-player.x)<52&&Math.abs(e.y-player.y)<34&&player.inv<=0){
          player.hp-=s.dmg;player.inv=0.7;shake=6;
          sfx.hurt();
          addFloat(player.x,player.y-70,"-"+s.dmg,"#e05545");
        }
        e.cd=e.type==="boss"?0.8:1.1;
      }
    }else if(e.cd>0){
      e.cd-=dt;
    }else{
      const ex=player.x-e.x, ey=player.y-e.y, d=Math.hypot(ex,ey);
      if(d<44){e.windup=e.type==="tox"?0.45:0.32;}
      else{
        const wobble=e.type==="tox"?Math.sin(tGlobal*3+e.wob)*30:0;
        e.x+=ex/d*s.speed*dt;
        e.y+=(ey/d*s.speed*0.7+wobble)*dt;
        e.y=Math.max(YMIN,Math.min(YMAX,e.y));
      }
    }
    if(e.hp<=0){
      kills++;
      player.xp+=s.xp;
      sfx.kill();
      burst(e.x,e.y-30,e.type==="tox"?"#8fa06a":"#e05545",12);
      addFloat(e.x,e.y-50,CRIS[Math.floor(Math.random()*CRIS.length)],"#ece5d3");
      if(Math.random()<0.32||e.type==="boss")drops.push({x:e.x,y:e.y,age:0});
      enemies.splice(i,1);
    }
  }

  /* Montée de niveau : le tribunal siège */
  while(player.xp>=xpNext()){
    player.xp-=xpNext();
    player.level++;
    player.maxHp+=20;player.hp=player.maxHp;
    sfx.levelup();
    addFloat(player.x,player.y-90,"NIVEAU "+player.level+" !","#ff9e1b");
    addFloat(player.x,player.y-70,"Uraken +5 dégâts","#ece5d3");
    const j=JUSTICE[(player.level-2)%JUSTICE.length];
    justice={t:4.5,qui:j.qui,mot:j.mot};
  }
  if(justice){justice.t-=dt;if(justice.t<=0)justice=null;}

  /* Boulets sauce lapin */
  for(let i=drops.length-1;i>=0;i--){
    const b=drops[i];b.age+=dt;
    if(Math.abs(b.x-player.x)<34&&Math.abs(b.y-player.y)<30){
      player.hp=Math.min(player.maxHp,player.hp+25);
      sfx.pickup();
      addFloat(b.x,b.y-50,"Boulet sauce lapin +25","#7fc46a");
      drops.splice(i,1);
    }else if(b.age>12)drops.splice(i,1);
  }

  /* Vagues et progression */
  if(gateX!==null&&enemies.length===0){gateX=null;sfx.go();}
  if(gateX===null&&waveI<zone.waves.length&&player.x>zone.waves[waveI].trig){
    spawnWave(zone.waves[waveI]);waveI++;
  }
  if(gateX===null&&waveI>=zone.waves.length&&player.x>zone.len-70){
    if(zoneI===0){state="splash";splashT=2.2;}
    else{state="victory";tGlobal=0;}
  }

  camX=Math.max(0,Math.min(player.x-W/2+80,zone.len-W));

  if(player.hp<=0){state="gameover";tGlobal=0;}

  /* Textes flottants + particules */
  for(let i=floats.length-1;i>=0;i--){floats[i].age+=dt;floats[i].y-=28*dt;if(floats[i].age>1.4)floats.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;
    if(p.age>0.5)particles.splice(i,1);
  }
}

  ctx.fillStyle="#c2ab72";ctx.fillRect(-9,-71,18,2);              // ombre sous la masse
  ctx.fillStyle="#cbb47c";ctx.fillRect(f>0?-9:6,-70,3,9);         // favoris épais
  /* lunettes fumées, plus fines : on voit le teint autour */
  ctx.fillStyle="#16130f";ctx.fillRect(f>0?-3:-6,-67,10,4);
  ctx.fillStyle="rgba(236,229,211,.5)";ctx.fillRect(f>0?4:-5,-66,2,1);
  ctx.fillStyle="#8a5f3c";ctx.fillRect(f>0?-1:-4,-61,5,1);        // ride du nez
  ctx.fillStyle="#7a4f34";ctx.fillRect(f>0?-2:-4,-56,7,2);        // rictus de rocker
  ctx.fillStyle="#c9a852";ctx.fillRect(f>0?6:-8,-62,2,3);         // boucle d'oreille
}
function johnnyBody(step){
  /* santiags, jean noir, perfecto ouvert sur t-shirt blanc, croix et ceinturon */
  ctx.fillStyle="#23232a";                                        // jean noir
  ctx.fillRect(-9+step*4,-26,8,26);
  ctx.fillRect(2-step*4,-26,8,26);
  ctx.fillStyle="#1b1b21";                                        // ombre d'entrejambe
  ctx.fillRect(-1,-26,2,20);
  ctx.fillStyle="#3d2a22";                                        // santiags pointues
  ctx.fillRect(-12+step*4,-5,13,6);
  ctx.fillRect(0-step*4,-5,13,6);
  ctx.fillStyle="#5a3e30";                                        // bout ferré
  ctx.fillRect(-12+step*4,-5,3,6);ctx.fillRect(10-step*4,-5,3,6);
  ctx.fillStyle="#1a1a22";ctx.fillRect(-13,-54,26,30);            // perfecto
  ctx.fillStyle="#ece5d3";ctx.fillRect(-4,-52,8,16);              // t-shirt blanc en V
  ctx.fillStyle="#ffd45a";                                        // croix en or au cou
  ctx.fillRect(-1,-49,2,7);ctx.fillRect(-3,-47,6,2);
  ctx.fillStyle="#8a8f99";                                        // zip en biais
  ctx.fillRect(-6,-52,1,26);
  ctx.fillStyle="#2c2c36";ctx.fillRect(-13,-54,26,4);             // col relevé
  ctx.fillRect(-15,-52,3,9);ctx.fillRect(12,-52,3,9);             // épaules du perfecto
  ctx.fillStyle="#241f1a";ctx.fillRect(-13,-28,26,4);             // ceinturon
  ctx.fillStyle="#c9a852";ctx.fillRect(-3,-29,7,5);               // grosse boucle
}
function drawJohnny(p){
  const x=p.x-camX, y=p.y;
  shadow(x,y,20);
  ctx.save();
  ctx.translate(x,y);
  if(p.inv>0&&Math.floor(p.inv*14)%2)ctx.globalAlpha=0.35;
  const f=p.facing;

  if(p.atkT>0){
    /* URAKEN UCHI : revers du poing, coude vers la cible, détente sèche */
    const prog=1-p.atkT/0.18;
    const ext=Math.min(1,prog/0.4);                               // détente du bras
    /* fente avant */
    ctx.fillStyle="#23232a";
    ctx.fillRect(f>0?-12:4,-26,8,26);                             // jambe arrière
    ctx.fillRect(f>0?4:-12,-24,8,24);                             // jambe avant
    ctx.fillStyle="#3d2a22";
    ctx.fillRect(f>0?-15:3,-5,13,6);
    ctx.fillRect(f>0?3:-15,-4,13,6);
    ctx.fillStyle="#5a3e30";
    ctx.fillRect(f>0?-15:14,-5,3,6);
    /* buste engagé */
    ctx.fillStyle="#241f1a";ctx.fillRect(-13+f*3,-28,26,4);       // ceinturon
    ctx.fillStyle="#c9a852";ctx.fillRect(-3+f*3,-29,7,5);         // boucle
    ctx.fillStyle="#1a1a22";ctx.fillRect(-13+f*3,-54,26,30);
    ctx.fillStyle="#ece5d3";ctx.fillRect(-4+f*3,-52,8,14);
    ctx.fillStyle="#ffd45a";                                      // la croix qui vole
    ctx.fillRect(-1+f*5,-49,2,7);ctx.fillRect(-3+f*5,-47,6,2);
    ctx.fillStyle="#2c2c36";ctx.fillRect(-13+f*3,-54,26,4);
    /* bras de garde replié devant la poitrine */
    ctx.fillStyle="#1a1a22";ctx.fillRect(f>0?-11:-1,-48,12,8);
    /* le bras qui fouette : dos du poing vers l'avant */
    const reach=10+26*ext;
    /* avant-bras fin, manche de perfecto */
    ctx.fillStyle="#1a1a22";
    if(f>0)ctx.fillRect(5,-51,reach,7); else ctx.fillRect(-5-reach,-51,reach,7);
    ctx.fillStyle="#2c2c36";                                      // pli de la manche
    if(f>0)ctx.fillRect(5,-51,reach,2); else ctx.fillRect(-5-reach,-51,reach,2);
    /* le dos du poing : c'est lui qui frappe */
    ctx.fillStyle="#c99a6e";
    if(f>0)ctx.fillRect(5+reach,-53,10,11); else ctx.fillRect(-15-reach,-53,10,11);
    ctx.fillStyle="#a87a50";                                      // phalanges
    if(f>0)ctx.fillRect(12+reach,-53,3,11); else ctx.fillRect(-15-reach,-53,3,11);
    ctx.fillStyle="#c9a852";                                      // chevalière
    if(f>0)ctx.fillRect(10+reach,-49,2,2); else ctx.fillRect(-12-reach,-49,2,2);
    /* traits de vitesse — le coup le plus rapide du monde */
    if(ext>0.6){
      ctx.fillStyle="rgba(255,158,27,.9)";
      for(let i=0;i<3;i++){
        const lx=f>0? reach+18 : -reach-40;
        ctx.fillRect(lx,-55+i*7,22,2);
      }
      ctx.fillStyle="rgba(255,158,27,.18)";                       // sillage discret
      if(f>0)ctx.fillRect(5,-49,reach,3); else ctx.fillRect(-5-reach,-49,reach,3);
    }
    ctx.save();ctx.translate(f*3,0);johnnyHead(f);ctx.restore();
    ctx.restore();
    return;
  }

  const step=Math.sin(p.walk)*((keys.left||keys.right||keys.up||keys.down)?1:0);
  johnnyBody(step);
  /* bras le long du perfecto */
  ctx.fillStyle="#1a1a22";
  ctx.fillRect(f>0?9:-17,-50,8,20);
  ctx.fillStyle="#d8a878";
  ctx.fillRect(f>0?9:-17,-31,8,7);
  johnnyHead(f);
  ctx.restore();
}
function drawTox(e){
  const x=e.x-camX,y=e.y;
  shadow(x,y,14);
  ctx.save();ctx.translate(x,y);
  if(e.hitFlash>0){ctx.globalAlpha=0.9;ctx.filter="brightness(2.2)";}
  const f=player.x>=e.x?1:-1;
  const shuffle=Math.sin(tGlobal*5+e.wob)*2;                     // pieds qui traînent
  const twitch=Math.sin(tGlobal*11+e.wob*3)>0.86?2:0;            // tremblement nerveux
  const agress=e.windup>0;

  /* jambes squelettiques, jogging qui tombe sur les baskets */
  ctx.fillStyle="#3d3b34";
  ctx.fillRect(-6+shuffle,-22,4,22);
  ctx.fillRect(2-shuffle,-22,4,22);
  ctx.fillStyle="#2c2a26";                                       // bas du jogging avachi
  ctx.fillRect(-8+shuffle,-8,8,5);ctx.fillRect(0-shuffle,-8,8,5);
  ctx.fillStyle="#6b6660";                                       // baskets ruinées
  ctx.fillRect(-9+shuffle,-3,10,4);ctx.fillRect(-1-shuffle,-3,10,4);

  /* dos voûté et épaules qui tombent — mais la tête reste lisible */
  const bend=agress?0.10:0.30;
  ctx.save();
  ctx.translate(0,-22);
  ctx.rotate(f*bend);
  /* hoodie délavé, trop grand de trois tailles */
  ctx.fillStyle="#4a4438";
  ctx.fillRect(-8,-26,16,27);
  ctx.fillStyle="#403a30";ctx.fillRect(-8,-8,16,9);              // poche ventrale
  ctx.fillStyle="#33302a";ctx.fillRect(-8,-26,16,4);             // épaules avachies
  /* capuche rabattue dans le dos */
  ctx.fillStyle="#3a352c";
  ctx.beginPath();ctx.ellipse(f>0?-8:8,-22,7,8,0,0,7);ctx.fill();
  /* bras maigres et trop longs, ballants */
  ctx.fillStyle="#4a4438";
  ctx.fillRect(f>0?-11:8,-22,4,25+twitch);
  ctx.fillRect(f>0?7:-11,-22,4,23);
  ctx.fillStyle="#a89684";
  ctx.fillRect(f>0?-11:8,3+twitch,4,4);                          // main squelettique
  /* la canette qui ne quitte jamais l'autre main */
  ctx.fillStyle="#8a8f96";ctx.fillRect(f>0?7:-11,0,4,7);
  ctx.fillStyle="#c94a3a";ctx.fillRect(f>0?7:-11,2,4,2);
  ctx.restore();

  /* cou tendu en avant et tête émaciée : la posture du tox qui scanne la rue */
  ctx.save();
  ctx.translate(f*4,-46+(agress?-2:0));
  ctx.rotate(f*0.12);
  ctx.fillStyle="#3d3830";ctx.fillRect(-4,2,8,5);                // col du hoodie
  ctx.fillStyle="#9c8a78";ctx.fillRect(-6,-13,12,15);            // visage gris
  ctx.fillStyle="#7d6c5c";                                       // joues creusées
  ctx.fillRect(-6,-5,3,6);ctx.fillRect(3,-5,3,6);
  ctx.fillStyle="#5c4f44";ctx.fillRect(-5,-14,11,3);             // cheveux ras et gras
  ctx.fillStyle="#4a3f38";ctx.fillRect(-5,-9,11,2);              // cernes profonds
  ctx.fillStyle="#191313";                                       // yeux enfoncés, fixes
  ctx.fillRect(f>0?-3:-4,-8,2,3);ctx.fillRect(f>0?2:1,-8,2,3);
  ctx.fillStyle="#6b5a4a";ctx.fillRect(-4,-1,9,2);               // barbe négligée
  ctx.fillStyle="#3a2e28";ctx.fillRect(f>0?-1:-2,-4,3,2);        // bouche entrouverte
  ctx.restore();

  if(agress){ctx.fillStyle="rgba(224,85,69,.85)";ctx.fillRect(-13,-62,26,4);}
  ctx.restore();
  hpBar(x,y-66,e.hp/e.maxHp,26);
}
function drawMachette(e,boss){
  const s=boss?1.5:1;
  const x=e.x-camX,y=e.y;
  shadow(x,y,18*s);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(e.hitFlash>0){ctx.globalAlpha=0.9;ctx.filter="brightness(2.2)";}
  const f=player.x>=e.x?1:-1;
  /* survêt rouge à bandes */
  ctx.fillStyle=boss?"#5c2350":"#a3352c";
  ctx.fillRect(-9,-26,8,26);ctx.fillRect(2,-26,8,26);
  ctx.fillStyle="#ded8ce";
  ctx.fillRect(-9,-20,3,18);ctx.fillRect(7,-20,3,18);
  ctx.fillStyle=boss?"#6e2c60":"#b8443a";
  ctx.fillRect(-12,-52,24,27);
  ctx.fillStyle="#ded8ce";ctx.fillRect(-12,-52,24,3);
  if(boss){ctx.fillStyle="#ffd45a";ctx.fillRect(-8,-46,16,3);}   // chaîne en or
  /* tête + bandana */
  ctx.fillStyle="#caa27c";ctx.fillRect(-8,-68,16,17);
  ctx.fillStyle="#20180f";ctx.fillRect(f>0?1:-4,-63,3,3);
  ctx.fillStyle=boss?"#ffd45a":"#20180f";ctx.fillRect(-9,-70,18,6);
  /* bras armé + machette */
  ctx.fillStyle=boss?"#6e2c60":"#b8443a";
  ctx.fillRect(f>0?9:-15,-50,6,18);
  const raise=e.windup>0?-16:0;
  ctx.fillStyle="#b9bec4";
  ctx.save();
  ctx.translate(f>0?14:-14,-40+raise);
  ctx.rotate(f*(e.windup>0?-0.9:0.5));
  ctx.fillRect(0,-3,26*f,6);
  ctx.restore();
  if(e.windup>0){ctx.fillStyle="rgba(224,85,69,.85)";ctx.fillRect(-13,-62,26,4);}
  ctx.restore();
  hpBar(x,y-(boss?100:66),e.hp/e.maxHp,boss?52:26);
}
function hpBar(x,y,ratio,w){
  ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(x-w/2,y,w,4);
  ctx.fillStyle=ratio>0.4?"#7fc46a":"#e05545";
  ctx.fillRect(x-w/2,y,w*Math.max(0,ratio),4);
}
function drawBoulet(b){
  const x=b.x-camX,y=b.y-6-Math.abs(Math.sin(b.age*4))*6;
  shadow(x,b.y,10);
  ctx.fillStyle="#6e4526";ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill();
  ctx.fillStyle="#9c5f2f";ctx.beginPath();ctx.arc(x-3,y-11,4,0,7);ctx.fill();
  ctx.fillStyle="#c2452f";ctx.fillRect(x-9,y-9,18,3);            // la sauce
}

/* ------------------------------------------------------------------ */
/* Dessin — HUD et écrans                                              */
/* ------------------------------------------------------------------ */
function txt(t,x,y,size,color,align,glow){
  ctx.save();
  ctx.font="bold "+size+"px 'Courier New',monospace";
  ctx.textAlign=align||"left";
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=14;}
  ctx.fillStyle=color;
  ctx.fillText(t,x,y);
  ctx.restore();
}
function drawHUD(){
  const zone=ZONES[zoneI];
  /* cartouche Johnny */
  ctx.fillStyle="rgba(12,10,8,.72)";
  ctx.fillRect(14,12,300,74);
  ctx.strokeStyle="#2b241c";ctx.strokeRect(14,12,300,74);
  txt("JOHNNY CADILLAC",26,34,15,"#ece5d3");
  txt("NIV "+player.level,296,34,13,"#ff9e1b","right");
  /* PV */
  ctx.fillStyle="#241d18";ctx.fillRect(26,44,270,12);
  ctx.fillStyle=player.hp/player.maxHp>0.35?"#e05545":"#ff2f1e";
  ctx.fillRect(26,44,270*Math.min(1,Math.max(0,player.hp/player.maxHp)),12);
  txt("PV",26,42,9,"#8f8574");
  /* XP */
  ctx.fillStyle="#241d18";ctx.fillRect(26,66,270,7);
  ctx.fillStyle="#ff9e1b";ctx.fillRect(26,66,270*(player.xp/xpNext()),7);
  txt("XP",26,64,9,"#8f8574");
  /* zone + adversaires */
  txt(zone.nom,W-20,34,15,"#ece5d3","right");
  txt(zone.sousTitre,W-20,52,11,"#8f8574","right");
  if(enemies.length)txt(enemies.length+" en face",W-20,70,11,"#e05545","right");

  if(introT>0&&introT<3.6){
    ctx.fillStyle="rgba(12,10,8,.7)";
    ctx.fillRect(W/2-330,96,660,40);
    txt(zone.intro,W/2,121,13,"#ece5d3","center");
  }
  if(gateX===null&&enemies.length===0&&Math.sin(tGlobal*6)>0){
    txt("AVANCE  ▶",W-40,H-30,20,"#ff9e1b","right","#ff9e1b");
  }
  /* l'audience : compliment du tribunal de Charleroi */
  if(justice){
    const a=Math.min(1,justice.t/0.4,(4.5-justice.t)/0.3);
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle="rgba(16,12,9,.92)";
    ctx.fillRect(W/2-370,150,740,64);
    ctx.strokeStyle="#c9a852";ctx.lineWidth=2;
    ctx.strokeRect(W/2-370,150,740,64);
    txt("⚖",W/2-346,190,26,"#c9a852");
    txt("TRIBUNAL DE CHARLEROI — "+justice.qui,W/2-310,172,12,"#c9a852");
    txt(justice.mot,W/2-310,196,13,"#ece5d3");
    ctx.restore();
  }
  if(player.cd>0&&player.atkT<=0){
    ctx.fillStyle="rgba(236,229,211,.25)";
    ctx.fillRect(26,80,60*(player.cd/0.45),3);
  }
}
function drawTitle(){
  drawSky(0);drawTerrils();drawIndustrie();drawTourBleue();drawBuildingsBasse();drawStreet(0);
  drawPluie();
  ctx.fillStyle="rgba(12,10,8,.55)";ctx.fillRect(0,0,W,H);
  const bounce=Math.sin(tGlobal*2)*4;
  txt("JOHNNY CADILLAC",W/2,180+bounce,58,"#ff9e1b","center","#ff9e1b");
  txt("le coup de poing le plus rapide du monde",W/2,222+bounce,18,"#ece5d3","center");
  /* Johnny en pied, plein cadre */
  ctx.save();ctx.translate(0,60);ctx.scale(1.6,1.6);
  drawJohnny({x:camX+W/2/1.6,y:250,facing:1,atkT:0,inv:0,walk:tGlobal*4});
  ctx.restore();
  txt("Ville Basse : les tox  ·  Ville Haute : les machettes",W/2,442,14,"#8f8574","center");
  txt("ZQSD / flèches : bouger      ESPACE : URAKEN",W/2,468,14,"#ece5d3","center");
  if(Math.sin(tGlobal*5)>0)txt("— APPUIE SUR ESPACE —",W/2,508,17,"#ff9e1b","center");
}
function drawSplash(){
  ctx.fillStyle="#0c0a08";ctx.fillRect(0,0,W,H);
  txt("LA VILLE BASSE EST NETTOYÉE",W/2,220,22,"#ece5d3","center");
  txt("VILLE HAUTE",W/2,290,52,"#ff9e1b","center","#ff9e1b");
  txt("Direction la place Charles II…",W/2,330,15,"#8f8574","center");
}
function drawGameover(){
  ctx.fillStyle="rgba(12,10,8,.8)";ctx.fillRect(0,0,W,H);
  txt("T'ES TOMBÉ, FIEU…",W/2,230,44,"#e05545","center");
  txt("Charleroi se souviendra quand même de toi.",W/2,280,15,"#ece5d3","center");
  txt("Adversaires mis au tapis : "+kills,W/2,320,14,"#8f8574","center");
  if(Math.sin(tGlobal*5)>0&&tGlobal>0.5)txt("— ESPACE POUR REMETTRE ÇA —",W/2,400,17,"#ff9e1b","center");
}
function drawVictory(){
  drawSky(1);drawTerrils();drawIndustrie();drawDomeStChristophe();drawBeffroi();drawBuildingsHaute();drawStreet(1);
  drawPluie();
  ctx.fillStyle="rgba(12,10,8,.6)";ctx.fillRect(0,0,W,H);
  txt("CHARLEROI EST NETTOYÉE",W/2,196,40,"#ff9e1b","center","#ff9e1b");
  txt("Johnny Cadillac, légende du Pays Noir",W/2,240,18,"#ece5d3","center");
  txt("Le tribunal classe le dossier sans suite.",W/2,264,13,"#c9a852","center");
  ctx.save();ctx.translate(0,80);ctx.scale(1.6,1.6);
  drawJohnny({x:camX+W/2/1.6,y:230,facing:1,atkT:0.18*(1-((tGlobal*2)%1)),inv:0,walk:0,hitApplied:true});
  ctx.restore();
  txt("Niveau atteint : "+player.level+"   ·   Mis au tapis : "+kills,W/2,452,14,"#8f8574","center");
  if(Math.sin(tGlobal*5)>0&&tGlobal>0.5)txt("— ESPACE POUR REJOUER —",W/2,500,16,"#ece5d3","center");
}

/* ------------------------------------------------------------------ */
/* Boucle                                                              */
/* ------------------------------------------------------------------ */
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==="title"){drawTitle();return;}
  if(state==="splash"){drawSplash();return;}
  if(state==="victory"){drawVictory();return;}

  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2);

  drawSky(zoneI);
  drawTerrils();
  drawIndustrie();
  if(zoneI===0)drawTourBleue();
  if(zoneI===1){drawDomeStChristophe();drawBeffroi();}
  (zoneI===0?drawBuildingsBasse:drawBuildingsHaute)();
  drawStreet(zoneI);

  /* tri par profondeur : plus bas = devant */
  const scene=[];
  for(const b of drops)scene.push({y:b.y,fn:()=>drawBoulet(b)});
  for(const e of enemies)scene.push({y:e.y,fn:()=>e.type==="tox"?drawTox(e):drawMachette(e,e.type==="boss")});
  scene.push({y:player.y,fn:()=>drawJohnny(player)});
  scene.sort((a,b)=>a.y-b.y).forEach(s=>s.fn());

  for(const p of particles){
    ctx.globalAlpha=1-p.age*2;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-camX-2,p.y-2,4,4);
    ctx.globalAlpha=1;
  }
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,2-f.age*1.4);
    txt(f.txt,f.x-camX,f.y,13,f.color,"center");
    ctx.globalAlpha=1;
  }
  drawPluie();
  ctx.restore();

  /* voile de crasse et vignettage : rien ne brille jamais tout à fait ici */
  const vg=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,620);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(62,54,48,.10)";ctx.fillRect(0,0,W,H);

  drawHUD();
  if(state==="gameover")drawGameover();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
