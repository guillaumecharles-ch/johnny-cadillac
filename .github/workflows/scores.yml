name: Classement

# Un joueur ouvre un ticket contenant son code JC1-, le robot le valide et met
# scores.json à jour. Le jeton reste sur le runner GitHub : rien de secret ne
# se retrouve dans la page du jeu.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  ajouter:
    if: startsWith(github.event.issue.title, 'Score')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire le code et mettre le classement à jour
        id: ajout
        env:
          CORPS: ${{ github.event.issue.body }}
          AUTEUR: ${{ github.event.issue.user.login }}
        run: printf '%s' "$CORPS" | python3 .github/scripts/ajouter_score.py

      - name: Publier le classement
        if: env.RESULTAT == 'ajoute'
        run: |
          git config user.name  "robot du classement"
          git config user.email "actions@github.com"
          git add scores.json
          git commit -m "Classement : ${JOUEUR} entre avec ${POINTS} points"
          git push

      - name: Répondre au joueur
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$RESULTAT" = "ajoute" ]; then
            gh issue comment "$NUM" --body "**${JOUEUR}** entre au classement avec **${POINTS} points**, à la ${RANG}ᵉ place. Le tableau se met à jour dans la minute : https://guillaumecharles-ch.github.io/johnny-cadillac/"
          else
            gh issue comment "$NUM" --body "Ce score est déjà au classement — rien à ajouter."
          fi
          gh issue close "$NUM"

      - name: Signaler un code illisible
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body "Je n'ai pas réussi à lire de code dans ce ticket. Le message doit contenir une ligne \`Code : JC1-…\`, copiée telle quelle depuis l'écran de fin du jeu."
